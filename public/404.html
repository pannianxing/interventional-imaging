<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>介入影像技术平台</title>
    <script type="text/javascript">
      // GitHub Pages 404 重定向到 Hash 路由
      var l = window.location;
      var path = l.pathname.replace(/^\/interventional-imaging\/?/, '');
      if (path && path !== '') {
        l.replace('/interventional-imaging/#/' + path + l.search + l.hash);
      } else {
        l.replace('/interventional-imaging/');
      }
    </script>
  </head>
  <body></body>
</html>
